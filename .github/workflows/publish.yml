name: Release

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[release:stage]')
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use npm 11 for staged publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Release
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$COMMIT_MESSAGE" == *"[release:stage]"* ]]; then
            node scripts/release-execute.mjs --stage
          else
            node scripts/release-execute.mjs
          fi
