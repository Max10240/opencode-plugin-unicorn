name: Publish

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Bump version
        run: |
          npm version patch --workspaces --allow-same-version --ignore-scripts \
            --git-tag-version=false --workspaces-update=false --include-workspace-root=false
          node scripts/sync-plugin-dependencies.mjs
          node scripts/check-versions.mjs

      - name: Build
        run: bun run build

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          publish_one() {
            local dir="$1"
            local name version
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version \
              --registry=https://registry.npmjs.org/ --prefer-online >/dev/null 2>&1; then
              echo "skip $name@$version"
            else
              npm publish "./$dir" --access public --ignore-scripts \
                --registry=https://registry.npmjs.org/
            fi
          }
          for dir in packages/*/; do
            if [ "$(node -p "require('./$dir/package.json').name")" = "@max10240/opencode-plugin-unicorn" ]; then
              continue
            fi
            publish_one "$dir"
          done
          publish_one packages/opencode-plugin-unicorn

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          if git diff --cached --quiet; then exit 0; fi
          version=$(node -p "require('./packages/opencode-plugin-unicorn/package.json').version")
          git commit -m "chore: release v$version [skip ci]"
          git push
