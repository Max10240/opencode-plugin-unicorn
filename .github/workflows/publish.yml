name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnose:
        description: Check npm trusted publisher configuration
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: |
      (github.event_name == 'workflow_dispatch' && !inputs.diagnose) ||
      (github.event_name == 'push' && github.event.head_commit && (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[release:stage]')))
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use npm 11 for staged publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Release
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$COMMIT_MESSAGE" == *"[release:stage]"* ]]; then
            node scripts/release-execute.mjs --stage
          else
            node scripts/release-execute.mjs
          fi

  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - name: Check trusted publishers
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs"
          import path from "node:path"

          const packages = fs.readdirSync("packages").flatMap((directory) => {
            try {
              const manifest = JSON.parse(fs.readFileSync(path.join("packages", directory, "package.json"), "utf8"))
              return manifest.name?.startsWith("@max10240/") ? [manifest.name] : []
            } catch {
              return []
            }
          })
          let missing = 0
          for (const pkg of packages) {
            const request = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
            request.searchParams.set("audience", "npm:registry.npmjs.org")
            const tokenResponse = await fetch(request, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            })
            const tokenBody = await tokenResponse.json()
            if (!tokenBody.value) {
              console.log(`${pkg}: no id-token (${tokenResponse.status})`)
              missing += 1
              continue
            }
            const escaped = pkg.replace("/", "%2f")
            const exchange = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${escaped}`, {
              method: "POST",
              headers: { Authorization: `Bearer ${tokenBody.value}` },
            })
            if (!exchange.ok) missing += 1
            console.log(`${pkg}: ${exchange.status} ${await exchange.text()}`)
          }
          console.log(`Missing trusted publisher: ${missing}/${packages.length}`)
          NODE
